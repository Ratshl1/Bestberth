<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .8s}
.scene img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.text{position:absolute;top:8%;left:50%;transform:translateX(-50%);color:#fff;font-size:2rem;
text-shadow:0 0 15px #4cf}
#dragonHit{position:absolute;left:25%;top:28%;width:50%;height:45%;cursor:pointer}
.hidden{opacity:0;pointer-events:none}
.btn{position:absolute;padding:12px 28px;border:2px solid #fff;color:#fff;background:rgba(0,0,0,.25);
border-radius:30px;text-decoration:none;font-size:22px;transition:.3s}
.btn:hover{background:rgba(255,255,255,.2);box-shadow:0 0 20px #8df}
#ocean{left:17%;top:40%}
#moon{right:17%;top:40%}
</style>
</head>
<body>

<div id="page1" class="scene">
<img src="IMG_5395.png" alt="">
<div class="text">Click on the dragon</div>
<div id="dragonHit"></div>
</div>

<div id="page2" class="scene hidden">
<img src="IMG_5396.png" alt="">
<div class="text">Choose one option</div>
<a href="#" id="ocean" class="btn">Ocean</a>
<a href="#" id="moon" class="btn">Moon</a>
</div>

<script>
const p1=document.getElementById("page1");
const p2=document.getElementById("page2");
document.getElementById("dragonHit").onclick=()=>{
 p1.style.opacity="0";
 setTimeout(()=>{
   p1.classList.add("hidden");
   p2.classList.remove("hidden");
   p2.style.opacity="1";
 },800);
};
document.getElementById("moon").onclick=(e)=>{
 e.preventDefault();
 alert("Moon selected (we will add functionality later).");
};
document.getElementById("ocean").onclick=(e)=>{
 e.preventDefault();
 alert("Ocean selected (we will add functionality later).");
};
</script>

</body>
</html>
