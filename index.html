<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Fantasy Dragon</title>
<style>
body,html{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial}
.page{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;transition:opacity .8s}
.hidden{opacity:0;pointer-events:none}
img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.7)}
.title{position:absolute;top:4%;left:50%;transform:translateX(-50%);color:#fff;white-space:nowrap;
font-size:clamp(24px,4vw,42px);text-shadow:0 0 10px #6ff,0 0 30px #09f}
.choice,.action{position:absolute;color:#fff;text-decoration:none;font-size:40px;text-shadow:0 0 15px #6ff}
#ocean{left:16%;top:30%}#moon{right:16%;top:30%}
#dragon{position:absolute;left:22%;top:20%;width:56%;height:62%;cursor:pointer}
.overlay{position:absolute;inset:0;background:radial-gradient(circle,transparent,rgba(0,0,0,.45))}
.message{position:absolute;top:6%;left:50%;transform:translateX(-50%);text-align:center;color:#fff;white-space:nowrap;font-size:clamp(20px,3vw,38px);text-shadow:0 0 12px #8cf}
.action{top:50%;left:50%;transform:translate(-50%,-50%)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
</style>
</head>
<body>
<div id="p1" class="page"><img class="bg" src="IMG_5395.png"><div class="overlay"></div><div class="title">Click on the dragon</div><div id="dragon"></div></div>
<div id="p2" class="page hidden"><img class="bg" src="IMG_5396.png"><div class="overlay"></div><div class="title">Choose one option</div><a id="ocean" class="choice" href="#">Ocean</a><a id="moon" class="choice" href="#">Moon</a></div>
<div id="p3" class="page hidden"><img class="bg" src="IMG_5466.jpeg"><div class="overlay"></div><div class="message">If you really love the moon<br>Click on the Moon</div><a class="action" href="#">Moon</a></div>
<div id="p4" class="page hidden"><img class="bg" src="IMG_5463.jpeg"><div class="overlay"></div><div class="message">If you believe in this ocean<br>Click on the Ocean</div><a class="action" href="#">Ocean</a></div>
<script>
const p1=p1=document.getElementById('p1'),p2=document.getElementById('p2'),p3=document.getElementById('p3'),p4=document.getElementById('p4');
dragon.onclick=()=>{p1.classList.add('hidden');p2.classList.remove('hidden');}
moon.onclick=e=>{e.preventDefault();p2.classList.add('hidden');p3.classList.remove('hidden');}
ocean.onclick=e=>{e.preventDefault();p2.classList.add('hidden');p4.classList.remove('hidden');}
for(let i=0;i<120;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*2+'s';document.body.appendChild(s);}
</script>
</body></html>
