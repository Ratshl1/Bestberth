<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dragon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100vw;
height:100vh;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;

}

.page{

position:fixed;
inset:0;
width:100vw;
height:100dvh;
overflow:hidden;
transition:opacity .8s;

display:flex;
justify-content:center;
align-items:center;

}

.hidden{

opacity:0;
pointer-events:none;

}

.page img{

position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;

}

.title{

position:absolute;
top:8%;
left:50%;
transform:translateX(-50%);
z-index:100;
color:white;
font-size:42px;
font-weight:bold;
letter-spacing:2px;

text-shadow:
0 0 10px #6ff,
0 0 20px #6ff,
0 0 40px #09f;

}

#dragon{

position:absolute;

left:22%;
top:20%;
width:56%;
height:62%;

cursor:pointer;

z-index:30;

}

/* الكلمات */

.choice{

position:absolute;

color:white;

font-size:42px;

font-weight:bold;

text-decoration:none;

z-index:40;

transition:.35s;

text-shadow:

0 0 10px #6ff,
0 0 20px #6ff,
0 0 35px #09f;

animation:glow 2s infinite alternate;

}

.choice:hover{

transform:scale(1.15);

text-shadow:

0 0 15px white,
0 0 30px cyan,
0 0 60px cyan;

}

/* الجناح الأيسر */

#ocean{

left:16%;
top:46%;
font-size:42px;

}

/* الجناح الأيمن */

#moon{

right:16%;
top:46%;
font-size:42px;

}

@keyframes glow{

from{

text-shadow:
0 0 8px cyan,
0 0 18px cyan,
0 0 30px #08f;

}

to{

text-shadow:
0 0 18px white,
0 0 35px cyan,
0 0 70px cyan;

}

}

.fade{

animation:fade .8s;

}

@keyframes fade{

from{opacity:0;}
to{opacity:1;}

}

</style>

</head>

<body>

<div id="page1" class="page fade">

<img src="IMG_5395.png">

<div class="title">

Click on the dragon

</div>

<div id="dragon"></div>

</div>

<div id="page2" class="page hidden">

<img src="IMG_5396.png">

<div class="title">

Choose one option

</div>

<a id="ocean" class="choice" href="#">

Ocean

</a>

<a id="moon" class="choice" href="#">

Moon

</a>

</div>

<script>
 const page1=document.getElementById("page1");
const page2=document.getElementById("page2");

const dragon=document.getElementById("dragon");
const moon=document.getElementById("moon");
const ocean=document.getElementById("ocean");

dragon.addEventListener("click",()=>{

page1.style.opacity="0";

setTimeout(()=>{

page1.classList.add("hidden");

page2.classList.remove("hidden");

page2.classList.add("fade");

},800);

});

moon.addEventListener("mouseenter",()=>{

moon.style.color="#9cf";

});

moon.addEventListener("mouseleave",()=>{

moon.style.color="white";

});

ocean.addEventListener("mouseenter",()=>{

ocean.style.color="#9cf";

});

ocean.addEventListener("mouseleave",()=>{

ocean.style.color="white";

});

moon.onclick=function(e){

e.preventDefault();

/* سنضيف لاحقاً */

};

ocean.onclick=function(e){

e.preventDefault();

/* سنضيف لاحقاً */

};
 </script>

</body>
</html>
