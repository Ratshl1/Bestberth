<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dark Dragon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;

}


.page{

position:fixed;
inset:0;

width:100%;
height:100dvh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

transition:opacity 1s;

}


.hidden{

opacity:0;
pointer-events:none;

}


.page img{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

z-index:0;

filter:brightness(.75);

}


/* ضباب */

.page::after{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(circle,
transparent 30%,
rgba(0,0,0,.7));

z-index:5;

pointer-events:none;

}


/* العناوين */

.title{

position:absolute;

top:4%;

left:50%;

transform:translateX(-50%);

z-index:80;

color:white;

font-size:clamp(24px,4vw,42px);

font-weight:bold;

letter-spacing:3px;

white-space:nowrap;


text-shadow:

0 0 10px #6ff,
0 0 30px #09f,
0 0 60px #06f;


animation:titleGlow 3s infinite alternate;

}



@keyframes titleGlow{


from{

filter:brightness(1);

}


to{

filter:brightness(1.5);

}


}



/* التنين */


#dragon{

position:absolute;

left:22%;

top:20%;

width:56%;

height:62%;

z-index:30;

cursor:pointer;


animation:

dragonBreath 4s infinite ease-in-out,
dragonGlow 3s infinite alternate;

}



@keyframes dragonBreath{


0%,100%{

transform:scale(1);

}


50%{

transform:scale(1.04);

}


}



@keyframes dragonGlow{


from{

filter:
drop-shadow(0 0 10px cyan);

}


to{

filter:
drop-shadow(0 0 45px #08f);

}


}



/* خيارات الاختيار */


.choice{

position:absolute;

z-index:40;


color:white;

font-size:42px;

font-weight:bold;

text-decoration:none;

white-space:nowrap;


text-shadow:

0 0 10px cyan,
0 0 30px #08f;


animation:

choiceGlow 2s infinite alternate;


transition:.4s;

}



.choice:hover{

transform:scale(1.15);

color:#9cf;

}



/* Ocean */


#ocean{

left:16%;

top:32%;

}



/* Moon */


#moon{

right:16%;

top:32%;

}



@keyframes choiceGlow{


from{

text-shadow:

0 0 10px cyan,
0 0 20px cyan;

}


to{

text-shadow:

0 0 20px white,
0 0 60px cyan;

}


}



/* الجزيئات */


.particle{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

opacity:.7;

z-index:20;

animation:float 8s infinite linear;

}



@keyframes float{


from{

transform:translateY(100vh);

opacity:0;

}


20%{

opacity:1;

}


to{

transform:translateY(-20vh);

opacity:0;

}


}



.fade{

animation:fade 1s;

}



@keyframes fade{

from{

opacity:0;

}


to{

opacity:1;

}


}


</style>

</head>


<body>


<div id="page1" class="page fade">


<img src="IMG_5395.png">


<div class="title">

Click on the dragon

</div>


<div id="dragon"></div>


</div>



<div id="page2" class="page hidden">


<img src="IMG_5396.png">


<div class="title">

Choose one option

</div>


<a id="ocean" class="choice" href="#">

Ocean

</a>


<a id="moon" class="choice" href="#">

Moon

</a>


</div>
<script>


const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

const dragon = document.getElementById("dragon");

const moon = document.getElementById("moon");
const ocean = document.getElementById("ocean");



/* الأصوات */

const roar = new Audio();

roar.src =
"https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3";


const ambient = new Audio();

ambient.src =
"https://assets.mixkit.co/active_storage/sfx/109/109-preview.mp3";

ambient.loop = true;

ambient.volume = 0.25;



const clickSound = new Audio();

clickSound.src =
"https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3";




/* تشغيل الجو العام بعد أول تفاعل */

document.body.addEventListener("click",()=>{

ambient.play().catch(()=>{});

},{once:true});





/* إنشاء الجسيمات */

function createParticles(){


for(let i=0;i<80;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDelay=
Math.random()*8+"s";


p.style.animationDuration=
(5+Math.random()*8)+"s";



document.body.appendChild(p);


}


}


createParticles();






/* الضغط على التنين */


dragon.addEventListener("click",()=>{


roar.play().catch(()=>{});


clickSound.play().catch(()=>{});



dragon.style.transform="scale(1.2)";

dragon.style.filter=
"drop-shadow(0 0 80px white)";



setTimeout(()=>{


page1.style.opacity="0";


setTimeout(()=>{


page1.classList.add("hidden");


page2.classList.remove("hidden");


page2.classList.add("fade");



},1000);



},500);



});







/* تأثير الماوس */


moon.addEventListener("mouseenter",()=>{


clickSound.play().catch(()=>{});


moon.style.color="#b8d8ff";


});



moon.addEventListener("mouseleave",()=>{


moon.style.color="white";


});





ocean.addEventListener("mouseenter",()=>{


clickSound.play().catch(()=>{});


ocean.style.color="#66ffff";


});



ocean.addEventListener("mouseleave",()=>{


ocean.style.color="white";


});







/* منع الانتقال حاليا */


moon.onclick=function(e){

e.preventDefault();

};


ocean.onclick=function(e){

e.preventDefault();

};



</script>


</body>

</html>
