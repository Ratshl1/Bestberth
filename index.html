<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dark Dragon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;

}


.page{

position:fixed;
inset:0;

width:100%;
height:100dvh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

transition:opacity 1s;

}


.hidden{

opacity:0;
pointer-events:none;

}


.page img{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

z-index:0;

filter:brightness(.75);

}


/* ضباب */

.page::after{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(circle,
transparent 30%,
rgba(0,0,0,.7));

z-index:5;

pointer-events:none;

}


/* طابع لوني خاص بكل صفحة */

#page2::after{

background:radial-gradient(circle,
transparent 25%,
rgba(20,0,40,.75));

}


#page3::after{

background:radial-gradient(circle,
transparent 25%,
rgba(0,25,35,.75));

}


#page4::after{

background:radial-gradient(circle,
transparent 25%,
rgba(10,10,35,.75));

}


#page5::after{

background:radial-gradient(circle,
transparent 20%,
rgba(0,20,30,.8));

}


#page6::after{

background:radial-gradient(circle,
transparent 20%,
rgba(15,10,35,.8));

}


/* هالة نبض هادئة حول صور الجنين */

.baby-glow{

position:absolute;

inset:0;

z-index:10;

pointer-events:none;

animation:babyPulse 6s infinite ease-in-out;

}


.ocean-baby-glow{

background:radial-gradient(circle at 50% 55%,
rgba(120,220,255,.22),
transparent 55%);

}


.moon-baby-glow{

background:radial-gradient(circle at 50% 45%,
rgba(255,240,200,.2),
transparent 55%);

}


@keyframes babyPulse{

0%,100%{

opacity:.5;

}

50%{

opacity:1;

}

}


/* العناوين */

.title{

position:absolute;

top:4%;

left:50%;

transform:translateX(-50%);

z-index:80;

color:white;

font-size:clamp(24px,4vw,42px);

font-weight:bold;

letter-spacing:3px;

white-space:nowrap;


text-shadow:

0 0 10px #6ff,
0 0 30px #09f,
0 0 60px #06f;


animation:titleGlow 3s infinite alternate;

}



@keyframes titleGlow{


from{

filter:brightness(1);

}


to{

filter:brightness(1.5);

}


}



/* التنين */


#dragon{

position:absolute;

left:22%;

top:20%;

width:56%;

height:62%;

z-index:30;

cursor:pointer;


animation:

dragonBreath 4s infinite ease-in-out,
dragonGlow 3s infinite alternate;

}



@keyframes dragonBreath{


0%,100%{

transform:scale(1);

}


50%{

transform:scale(1.04);

}


}



@keyframes dragonGlow{


from{

filter:
drop-shadow(0 0 10px cyan);

}


to{

filter:
drop-shadow(0 0 45px #08f);

}


}



/* خيارات الاختيار */


.choice{

position:absolute;

z-index:40;


color:white;

font-size:42px;

font-weight:bold;

text-decoration:none;

white-space:nowrap;

cursor:pointer;


text-shadow:

0 0 10px cyan,
0 0 30px #08f;


animation:

choiceGlow 2s infinite alternate;


transition:.4s;

}



.choice:hover{

transform:scale(1.15);

color:#9cf;

}



/* Ocean */


#ocean{

left:16%;

top:30%;

}



/* Moon */


#moon{

right:16%;

top:30%;

}



@keyframes choiceGlow{


from{

text-shadow:

0 0 10px cyan,
0 0 20px cyan;

}


to{

text-shadow:

0 0 20px white,
0 0 60px cyan;

}


}


/* نص فوق صور البحر والقمر */

.overlay-text{

position:absolute;

top:45%;

left:50%;

transform:translate(-50%,-50%);

z-index:60;

color:white;

font-size:clamp(20px,3vw,34px);

font-weight:bold;

text-align:center;

padding:0 20px;

cursor:pointer;

white-space:normal;

max-width:80%;

text-shadow:

0 0 10px cyan,
0 0 30px #08f,
0 0 60px #06f;

animation:choiceGlow 2s infinite alternate;

transition:.4s;

}


.overlay-text:hover{

transform:translate(-50%,-50%) scale(1.08);

color:#9cf;

}


/* تنسيق خاص بنص البحر: أصغر حجمًا وبلمسة مائية متموجة */

.overlay-text.ocean{

font-size:clamp(12px,1.6vw,19px);

font-style:italic;

font-weight:600;

letter-spacing:.5px;

max-width:65%;

line-height:1.4;

color:#dfffff;

text-shadow:

0 0 8px #0ff,
0 0 20px #0cf,
0 0 40px #036;

animation:oceanGlow 2.6s infinite alternate,
oceanFloat 3.5s infinite ease-in-out;

}


.overlay-text.ocean::after{

content:"";

position:absolute;

left:50%;

bottom:-10px;

transform:translateX(-50%);

width:70%;

height:2px;

background:linear-gradient(90deg,
transparent,
#0ff,
transparent);

opacity:.7;

animation:oceanShimmer 2.6s infinite ease-in-out;

}


.overlay-text.ocean:hover{

transform:translate(-50%,-50%) scale(1.1);

color:#aaffff;

}


@keyframes oceanGlow{

from{

text-shadow:

0 0 8px #0ff,
0 0 18px #0cf,
0 0 30px #024;

}

to{

text-shadow:

0 0 14px #aff,
0 0 30px #0ff,
0 0 55px #048;

}

}


@keyframes oceanFloat{

0%,100%{

transform:translate(-50%,-50%) translateY(0);

}

50%{

transform:translate(-50%,-50%) translateY(-6px);

}

}


@keyframes oceanShimmer{

0%,100%{

opacity:.3;

width:50%;

}

50%{

opacity:.9;

width:80%;

}

}


/* تنسيق خاص بنص القمر: هالة فضية هادئة */

.overlay-text.moonstyle{

font-size:clamp(16px,2.2vw,26px);

font-weight:500;

letter-spacing:1.5px;

max-width:70%;

line-height:1.4;

color:#f4f4ff;

text-shadow:

0 0 8px #dcdcff,
0 0 20px #b3b3ff,
0 0 45px #6666cc;

animation:moonGlow 3.4s infinite alternate,
moonPulse 4.5s infinite ease-in-out;

}


.overlay-text.moonstyle::before{

content:"";

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:120%;

height:220%;

border-radius:50%;

background:radial-gradient(circle,
rgba(220,220,255,.12),
transparent 70%);

z-index:-1;

animation:moonHalo 4.5s infinite ease-in-out;

}


.overlay-text.moonstyle:hover{

transform:translate(-50%,-50%) scale(1.08);

color:#ffffff;

}


@keyframes moonGlow{

from{

text-shadow:

0 0 8px #dcdcff,
0 0 18px #b3b3ff,
0 0 30px #5555aa;

}

to{

text-shadow:

0 0 16px #ffffff,
0 0 35px #cfcfff,
0 0 60px #7777dd;

}

}


@keyframes moonPulse{

0%,100%{

transform:translate(-50%,-50%) translateY(0);

}

50%{

transform:translate(-50%,-50%) translateY(-4px);

}

}


@keyframes moonHalo{

0%,100%{

opacity:.5;

transform:translate(-50%,-50%) scale(1);

}

50%{

opacity:1;

transform:translate(-50%,-50%) scale(1.15);

}

}



/* الجزيئات */


.particle{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

opacity:.7;

z-index:20;

animation:float 8s infinite linear;

}



@keyframes float{


from{

transform:translateY(100vh);

opacity:0;

}


20%{

opacity:1;

}


to{

transform:translateY(-20vh);

opacity:0;

}


}


/* غبار مضيء أزرق فاتح - يناسب مشهد التنين تحت الماء */

.particle-plankton{

position:absolute;

border-radius:50%;

z-index:20;

background:radial-gradient(circle,#eafcff,#4dd8ff);

box-shadow:0 0 8px #6fe0ff;

opacity:.75;

animation:planktonFloat 9s infinite ease-in-out;

}


@keyframes planktonFloat{

0%{

transform:translateY(100vh) translateX(0);

opacity:0;

}

15%{

opacity:.9;

}

50%{

transform:translateY(30vh) translateX(10px);

}

85%{

opacity:.6;

}

100%{

transform:translateY(-25vh) translateX(-8px);

opacity:0;

}

}


/* شرارات بنفسجية - صفحة الاختيار */

.particle-portal{

position:absolute;

border-radius:50%;

z-index:20;

background:#c9a3ff;

box-shadow:0 0 10px #a855f7;

animation:float 7s infinite linear;

}


/* فقاعات - صفحة البحر */

.particle-bubble{

position:absolute;

border-radius:50%;

z-index:20;

background:rgba(180,255,255,.35);

border:1px solid rgba(220,255,255,.5);

box-shadow:0 0 6px rgba(150,255,255,.6);

animation:bubbleFloat 9s infinite ease-in;

}


@keyframes bubbleFloat{

0%{

transform:translateY(20vh) translateX(0);

opacity:0;

}

15%{

opacity:.8;

}

50%{

transform:translateY(-40vh) translateX(15px);

}

100%{

transform:translateY(-110vh) translateX(-10px);

opacity:0;

}

}


/* غبار فضي متلألئ - صفحة القمر */

.particle-stardust{

position:absolute;

border-radius:50%;

z-index:20;

background:#ffffff;

box-shadow:0 0 10px #dcdcff;

animation:twinkleFloat 10s infinite ease-in-out;

}


@keyframes twinkleFloat{

0%{

transform:translateY(60vh);

opacity:0;

}

30%{

opacity:1;

}

60%{

opacity:.3;

}

80%{

opacity:1;

}

100%{

transform:translateY(-40vh);

opacity:0;

}

}



.fade{

animation:fade 1s;

}



@keyframes fade{

from{

opacity:0;

}


to{

opacity:1;

}


}


</style>

</head>


<body>


<div id="page1" class="page fade">


<img src="IMG_5395.png">


<div class="title">

Click on the dragon

</div>


<div id="dragon"></div>


</div>



<div id="page2" class="page hidden">


<img src="IMG_5396.png">


<div class="title">

Choose one option

</div>


<a id="ocean" class="choice" href="#">

Ocean

</a>


<a id="moon" class="choice" href="#">

Moon

</a>


</div>


<div id="page3" class="page hidden">


<img src="IMG_5466.jpeg">

if u really believe in this ocean then click on it

</div>


</div>


<div id="page4" class="page hidden">


<img src="IMG_5463.jpeg">


<div id="moonText" class="overlay-text moonstyle">

if u really love the moon click on it

</div>


</div>


<div id="page5" class="page hidden">


<img src="F08BFBA2-9342-4FE1-94C8-CCADEA6970BB.png">

</div>


<div id="page6" class="page hidden">

</div>
<script>




const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const page3 = document.getElementById("page3");
const page4 = document.getElementById("page4");
const page5 = document.getElementById("page5");
const page6 = document.getElementById("page6");

const dragon = document.getElementById("dragon");

const moon = document.getElementById("moon");
const ocean = document.getElementById("ocean");

const oceanText = document.getElementById("oceanText");
const moonText = document.getElementById("moonText");



/* الأصوات - كلها مركّبة بالكود مباشرة، بدون أي اعتماد على روابط خارجية قد تنقطع أو تُحجب */

let audioCtx=null;


function getCtx(){


if(!audioCtx){

audioCtx=new (window.AudioContext||window.webkitAudioContext)();


/* حيلة لفتح الصوت على آيفون/سفاري: تشغيل بَفر صامت فور أول تفاعل */

const unlockBuffer=audioCtx.createBuffer(1,1,22050);

const unlockSource=audioCtx.createBufferSource();

unlockSource.buffer=unlockBuffer;

unlockSource.connect(audioCtx.destination);

unlockSource.start(0);

}


if(audioCtx.state==="suspended"){

audioCtx.resume();

}


return audioCtx;


}



/* نقرة ناعمة هادئة */

function playClickTick(){


const ctx=getCtx();

const now=ctx.currentTime;


const osc=ctx.createOscillator();

const gain=ctx.createGain();


osc.type="sine";

osc.frequency.setValueAtTime(520,now);

osc.frequency.exponentialRampToValueAtTime(340,now+0.18);


gain.gain.setValueAtTime(0,now);

gain.gain.linearRampToValueAtTime(0.07,now+0.02);

gain.gain.exponentialRampToValueAtTime(0.001,now+0.22);


osc.connect(gain).connect(ctx.destination);


osc.start(now);

osc.stop(now+0.24);


}



/* هدير تنين عميق وهادئ - نغمة منخفضة ممتدة بدل الزئير الحاد */

function playDragonRoar(){


const ctx=getCtx();

const now=ctx.currentTime;

const dur=2.6;


const bufferSize=ctx.sampleRate*dur;

const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);

const data=buffer.getChannelData(0);


for(let i=0;i<bufferSize;i++){

data[i]=Math.random()*2-1;

}


const noise=ctx.createBufferSource();

noise.buffer=buffer;


const noiseFilter=ctx.createBiquadFilter();

noiseFilter.type="lowpass";

noiseFilter.frequency.setValueAtTime(500,now);

noiseFilter.frequency.linearRampToValueAtTime(180,now+dur);


const noiseGain=ctx.createGain();

noiseGain.gain.setValueAtTime(0,now);

noiseGain.gain.linearRampToValueAtTime(0.12,now+0.6);

noiseGain.gain.linearRampToValueAtTime(0,now+dur);


noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);


const osc=ctx.createOscillator();

const oscGain=ctx.createGain();


osc.type="sine";

osc.frequency.setValueAtTime(85,now);

osc.frequency.linearRampToValueAtTime(55,now+dur);


oscGain.gain.setValueAtTime(0,now);

oscGain.gain.linearRampToValueAtTime(0.22,now+0.5);

oscGain.gain.linearRampToValueAtTime(0,now+dur);


osc.connect(oscGain).connect(ctx.destination);


noise.start(now);

noise.stop(now+dur+0.1);


osc.start(now);

osc.stop(now+dur+0.1);


}



/* صوت بوابة سحرية هادئ ومتصاعد ببطء - صفحة الاختيار */

function playPortalSound(){


const ctx=getCtx();

const now=ctx.currentTime;

const notes=[523.25,659.25,783.99,1046.5];


notes.forEach((freq,i)=>{


const osc=ctx.createOscillator();

const gain=ctx.createGain();


osc.type="sine";

osc.frequency.value=freq;


gain.gain.setValueAtTime(0,now+i*0.22);

gain.gain.linearRampToValueAtTime(0.09,now+i*0.22+0.3);

gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.22+1.8);


osc.connect(gain).connect(ctx.destination);


osc.start(now+i*0.22);

osc.stop(now+i*0.22+1.85);


});


}



/* صوت موجة بحر هادئة وممتدة - صفحة البحر */

function playOceanWave(){


const ctx=getCtx();

const now=ctx.currentTime;

const dur=4.5;


const bufferSize=ctx.sampleRate*dur;

const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);

const data=buffer.getChannelData(0);


for(let i=0;i<bufferSize;i++){

data[i]=Math.random()*2-1;

}


const noise=ctx.createBufferSource();

noise.buffer=buffer;


const filter=ctx.createBiquadFilter();

filter.type="bandpass";

filter.Q.value=0.6;

filter.frequency.setValueAtTime(220,now);

filter.frequency.linearRampToValueAtTime(550,now+2.2);

filter.frequency.linearRampToValueAtTime(180,now+dur);


const gain=ctx.createGain();

gain.gain.setValueAtTime(0,now);

gain.gain.linearRampToValueAtTime(0.18,now+1.4);

gain.gain.linearRampToValueAtTime(0,now+dur);


noise.connect(filter).connect(gain).connect(ctx.destination);


noise.start(now);

noise.stop(now+dur+0.1);


}



/* رنة جرس هادئة - صفحة القمر */

function playMoonChime(){


const ctx=getCtx();

const now=ctx.currentTime;

const freqs=[660,880,1108.73];


freqs.forEach((freq,i)=>{


const osc=ctx.createOscillator();

const gain=ctx.createGain();


osc.type="sine";

osc.frequency.value=freq;


gain.gain.setValueAtTime(0,now+i*0.35);

gain.gain.linearRampToValueAtTime(0.08,now+i*0.35+0.3);

gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.35+3.5);


osc.connect(gain).connect(ctx.destination);


osc.start(now+i*0.35);

osc.stop(now+i*0.35+3.6);


}



/* نبض قلب هادئ جدا وبطيء - صفحة جنين البحر */

function playOceanBabySound(){


const ctx=getCtx();

const now=ctx.currentTime;

const dur=5;


/* نبضة قلب بسيطة تتكرر ببطء */

const beatTimes=[0,1.1,2.3,3.4];


beatTimes.forEach((t)=>{


const osc=ctx.createOscillator();

const gain=ctx.createGain();


osc.type="sine";

osc.frequency.setValueAtTime(65,now+t);

osc.frequency.exponentialRampToValueAtTime(40,now+t+0.35);


gain.gain.setValueAtTime(0,now+t);

gain.gain.linearRampToValueAtTime(0.1,now+t+0.06);

gain.gain.exponentialRampToValueAtTime(0.001,now+t+0.4);


osc.connect(gain).connect(ctx.destination);


osc.start(now+t);

osc.stop(now+t+0.45);


});


/* خلفية مائية خافتة جدا */

const bufferSize=ctx.sampleRate*dur;

const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);

const data=buffer.getChannelData(0);


for(let i=0;i<bufferSize;i++){

data[i]=Math.random()*2-1;

}


const noise=ctx.createBufferSource();

noise.buffer=buffer;


const filter=ctx.createBiquadFilter();

filter.type="lowpass";

filter.frequency.value=350;


const noiseGain=ctx.createGain();

noiseGain.gain.setValueAtTime(0,now);

noiseGain.gain.linearRampToValueAtTime(0.05,now+1.5);

noiseGain.gain.linearRampToValueAtTime(0,now+dur);


noise.connect(filter).connect(noiseGain).connect(ctx.destination);


noise.start(now);

noise.stop(now+dur+0.1);


}



/* نغمة نوم هادئة جدا كأنها تهويدة - صفحة جنين القمر */

function playMoonBabySound(){


const ctx=getCtx();

const now=ctx.currentTime;

const notes=[440,523.25,659.25,523.25];


notes.forEach((freq,i)=>{


const osc=ctx.createOscillator();

const gain=ctx.createGain();


osc.type="sine";

osc.frequency.value=freq;


gain.gain.setValueAtTime(0,now+i*0.9);

gain.gain.linearRampToValueAtTime(0.06,now+i*0.9+0.4);

gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.9+2.2);


osc.connect(gain).connect(ctx.destination);


osc.start(now+i*0.9);

osc.stop(now+i*0.9+2.3);


});


}

document.body.addEventListener("click",()=>{

getCtx();

},{once:true});





/* إنشاء الجسيمات الخاصة بكل مشهد */

function createParticles(container,className,count,sizeMin,sizeMax){


for(let i=0;i<count;i++){


let p=document.createElement("div");


p.className=className;


let size=sizeMin+Math.random()*(sizeMax-sizeMin);


p.style.width=size+"px";

p.style.height=size+"px";


p.style.left=Math.random()*100+"%";


/* لازم نحدد top بشكل صريح، لأن الحاوية flex وإلا الجسيمات تتجمع بمنتصف الصفحة */

p.style.top="0";


p.style.animationDelay=
Math.random()*8+"s";


p.style.animationDuration=
(5+Math.random()*8)+"s";



container.appendChild(p);


}


}


createParticles(page1,"particle-plankton",55,2,5);

createParticles(page2,"particle-portal",60,3,6);

createParticles(page3,"particle-bubble",45,4,10);

createParticles(page4,"particle-stardust",70,1,3);

createParticles(page5,"particle-plankton",30,2,4);

createParticles(page6,"particle-stardust",40,1,3);




/* دالة عامة للانتقال بين صفحتين مع تأثير fade */

function goToPage(fromPage,toPage){


fromPage.style.opacity="0";


setTimeout(()=>{


fromPage.classList.add("hidden");


toPage.classList.remove("hidden");


toPage.classList.add("fade");


toPage.style.opacity="1";


},1000);


}





/* الضغط على التنين */


dragon.addEventListener("click",()=>{


playDragonRoar();


playClickTick();



dragon.style.transform="scale(1.2)";

dragon.style.filter=
"drop-shadow(0 0 80px white)";



setTimeout(()=>{


playPortalSound();

goToPage(page1,page2);


},500);



});







/* تأثير الماوس */


moon.addEventListener("mouseenter",()=>{


playClickTick();


moon.style.color="#b8d8ff";


});



moon.addEventListener("mouseleave",()=>{


moon.style.color="white";


});





ocean.addEventListener("mouseenter",()=>{


playClickTick();


ocean.style.color="#66ffff";


});



ocean.addEventListener("mouseleave",()=>{


ocean.style.color="white";


});





/* الضغط على Ocean يفتح صفحة البحر */


ocean.onclick=function(e){

e.preventDefault();

playClickTick();

goToPage(page2,page3);


setTimeout(()=>{

playOceanWave();

},1000);


};



/* الضغط على Moon يفتح صفحة القمر */


moon.onclick=function(e){
